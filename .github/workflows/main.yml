                              indication = null,
                              onClick = onClick
                          )
                          .padding(
                              horizontal = 24.dp,
                              vertical = 6.dp
                          )
              ) {

                  Box(
                      modifier =
                          Modifier.size(26.dp),
                      contentAlignment =
                          Alignment.Center
