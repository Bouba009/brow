          @Composable
          fun BottomBar(
              selected: Int,
              onSelected: (Int) -> Unit
          ) {

              Row(
                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .background(
                              SurfaceColor
                          )
                          .padding(
                              vertical = 10.dp
                          ),
                  horizontalArrangement =
                      Arrangement.SpaceEvenly
              ) {

                  NavigationItem(
                      selected == 0,
                      Icons.Default.Home,
                      "Monitor"
                  ) {
                      onSelected(0)
