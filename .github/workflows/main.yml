                                      80f
                                  ),
                              strokeWidth = 8f,
                              cap = StrokeCap.Round
                          )

                          drawLine(
                              color = Green,
                              start =
                                  Offset(
                                      cx,
                                      90f
                                  ),
                              end =
                                  Offset(
                                      cx + 85f,
                                      80f
                                  ),
                              strokeWidth = 8f,
                              cap = StrokeCap.Round
                          )
                      }

                      "Wall Angels" -> {

                          drawLine(
                              color = Green,
                              start =
                                  Offset(
                                      cx,
                                      100f
                                  ),
                              end =
                                  Offset(
                                      cx - 75f,
                                      55f
                                  ),
                              strokeWidth = 8f,
                              cap = StrokeCap.Round
                          )

                          drawLine(
                              color = Green,
                              start =
                                  Offset(
                                      cx,
                                      100f
                                  ),
                              end =
                                  Offset(
                                      cx + 75f,
                                      55f
                                  ),
                              strokeWidth = 8f,
