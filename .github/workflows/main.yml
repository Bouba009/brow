data class Exercise(
    val name: String,
    val description: String,
    val target: String,
    val mistake: String
)

@Composable
fun ExerciseCard(
    exercise: Exercise
) {

    var seconds by remember {
        mutableIntStateOf(0)
    }

    var running by remember {
        mutableStateOf(false)
    }

    LaunchedEffect(running) {

        while (running) {

            delay(1000)

            seconds++
        }
    }

    Card(
        modifier = Modifier.fillMaxWidth(),
        shape = RoundedCornerShape(22.dp),
        colors = CardDefaults.cardColors(
            containerColor =
                MaterialTheme.colorScheme.surface
        )
    ) {

        Column(
            modifier = Modifier.padding(18.dp)
        ) {

            Text(
                text = exercise.name,
                style = MaterialTheme.typography.titleLarge,
                fontWeight = FontWeight.Bold
            )

            Spacer(
                modifier = Modifier.height(12.dp)
            )

            ExerciseIllustration()

            Spacer(
                modifier = Modifier.height(12.dp)
            )

            Text(
                text = exercise.description
            )

            Spacer(
                modifier = Modifier.height(8.dp)
            )

            Text(
                text = "Target: ${exercise.target}",
                color = MaterialTheme.colorScheme.primary
            )

            Spacer(
                modifier = Modifier.height(6.dp)
            )

            Text(
                text = "Common mistake: ${exercise.mistake}",
                color = MaterialTheme.colorScheme.secondary
            )

            Spacer(
                modifier = Modifier.height(14.dp)
            )

            Text(
                text = formatTime(seconds),
                style = MaterialTheme.typography.headlineSmall,
                fontWeight = FontWeight.Bold
            )

            Spacer(
                modifier = Modifier.height(10.dp)
            )

            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.spacedBy(8.dp)
            ) {

                Button(
                    onClick = {
                        running = !running
                    },
                    modifier = Modifier.weight(1f),
                    colors = ButtonDefaults.buttonColors(
                        containerColor =
                            MaterialTheme.colorScheme.primary
                    )
                ) {

                    Text(
                        text =
                            if (running) "PAUSE"
                            else "START"
                    )
                }

                Button(
                    onClick = {
                        running = false
                        seconds = 0
                    },
                    modifier = Modifier.weight(1f)
                ) {

                    Text("RESET")
                }
            }
        }
    }
}

fun formatTime(
    totalSeconds: Int
): String {

    val minutes =
        totalSeconds / 60

    val seconds =
        totalSeconds % 60

    return "%02d:%02d".format(
        minutes,
        seconds
    )
}

@Composable
fun ExerciseIllustration() {

    Box(
        modifier = Modifier
            .fillMaxWidth()
            .height(140.dp)
            .clip(RoundedCornerShape(18.dp))
            .background(
                MaterialTheme.colorScheme.background
            )
    ) {

        Canvas(
            modifier = Modifier.fillMaxSize()
        ) {

            val cx = size.width / 2f

            drawCircle(
                color = androidx.compose.ui.graphics.Color(0xFF63E6BE),
                radius = 18f,
                center = Offset(
                    cx,
                    35f
                )
            )

            drawLine(
                color = androidx.compose.ui.graphics.Color(0xFF74C0FC),
                start = Offset(cx, 53f),
                end = Offset(cx, 105f),
                strokeWidth = 10f,
                cap = StrokeCap.Round
            )

            drawLine(
                color = androidx.compose.ui.graphics.Color(0xFF63E6BE),
                start = Offset(
                    cx - 45f,
                    70f
                ),
                end = Offset(
                    cx + 45f,
                    70f
                ),
                strokeWidth = 9f,
                cap = StrokeCap.Round
            )

            drawLine(
                color = androidx.compose.ui.graphics.Color(0xFF74C0FC),
                start = Offset(
                    cx,
                    105f
                ),
                end = Offset(
                    cx - 30f,
                    132f
                ),
                strokeWidth = 9f,
                cap = StrokeCap.Round
            )

            drawLine(
                color = androidx.compose.ui.graphics.Color(0xFF74C0FC),
                start = Offset(
                    cx,
                    105f
                ),
                end = Offset(
                    cx + 30f,
                    132f
                ),
                strokeWidth = 9f,
                cap = StrokeCap.Round
            )
        }
    }
}

@Composable
fun BottomBar(
    selectedTab: Int,
    onSelected: (Int) -> Unit
) {

    Row(
        modifier = Modifier
            .fillMaxWidth()
            .background(
                MaterialTheme.colorScheme.surface
            )
            .padding(
                horizontal = 12.dp,
                vertical = 10.dp
            ),
        horizontalArrangement = Arrangement.SpaceEvenly
    ) {

        BottomItem(
            text = "HOME",
            selected = selectedTab == 0,
            onClick = {
                onSelected(0)
            }
        )

        BottomItem(
            text = "EXERCISES",
            selected = selectedTab == 1,
            onClick = {
                onSelected(1)
            }
        )
    }
}

@Composable
fun BottomItem(
    text: String,
    selected: Boolean,
    onClick: () -> Unit
) {

    val interactionSource =
        remember {
            androidx.compose.foundation.interaction.MutableInteractionSource()
        }

    Text(
        text = text,
        color =
            if (selected)
                MaterialTheme.colorScheme.primary
            else
                MaterialTheme.colorScheme.onSurface,
        fontWeight =
            if (selected)
                FontWeight.Bold
            else
                FontWeight.Normal,
        modifier = Modifier
            .clip(RoundedCornerShape(14.dp))
            .clickable(
                interactionSource = interactionSource,
                indication = null,
                onClick = onClick
            )
            .padding(
                horizontal = 28.dp,
                vertical = 12.dp
            )
    )
}
