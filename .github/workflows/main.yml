          @Composable
          fun NavigationItem(
              selected: Boolean,
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              label: String,
              onClick: () -> Unit
          ) {

              val interactionSource =
                  remember {
                      MutableInteractionSource()
                  }

              Column(
                  horizontalAlignment =
                      Alignment.CenterHorizontally,
                  modifier =
                      Modifier
                          .clip(
                              RoundedCornerShape(14.dp)
                          )
                          .clickable(
                              interactionSource =
                                  interactionSource,
                              indication = null,
                              onClick = onClick
                          )
                          .padding(
                              horizontal = 24.dp,
                              vertical = 6.dp
                          )
              ) {

                  Icon(
                      icon,
                      contentDescription = null,
                      tint =
                          if (selected)
                              Green
                          else
                              Gray
                  )

                  Text(
                      label,
                      color =
                          if (selected)
                              Green
                          else
                              Gray,
                      fontSize = 11.sp
                  )
              }
          }
          EOF

          echo "=========================================="
