name: Build ApexBrowser Store Release

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Production Bundle (AAB) & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias apexkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass apexkeystorepass -keypass apexkeystorepass \
            -dname "CN=ApexBrowser, OU=Production, O=ApexBrowser, L=Algiers, ST=Algiers, C=DZ"

      - name: Generate Android Project Structure & Source Code
        run: |
          set -e

          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/apex/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ApexBrowser"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.apex.browser"
              compileSdk = 34

              signingConfigs {
                  create("release") {
                      storeFile = file("${rootProject.projectDir}/release.jks")
                      storePassword = "apexkeystorepass"
                      keyAlias = "apexkey"
                      keyPassword = "apexkeystorepass"
                  }
              }

              defaultConfig {
                  applicationId = "com.apex.browser"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.webkit:webkit:1.10.0")

              implementation("com.google.android.gms:play-services-ads:23.0.0")
          }
          EOF

          touch app/proguard-rules.pro

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ApexBrowser</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_browser_logo.xml
