          echo "SafePosture project created successfully."

      # ---------------------------------------------------------
      # Setup Gradle 8.7
      # Cache intentionally disabled
      # ---------------------------------------------------------
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-disabled: true

      # ---------------------------------------------------------
      # Verify tools
      # ---------------------------------------------------------
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      # ---------------------------------------------------------
      # Clean
      # ---------------------------------------------------------
      - name: Clean project
        run: |
          gradle --no-daemon clean

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug

      # ---------------------------------------------------------
      # Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # Rename APK
      # ---------------------------------------------------------
      - name: Rename SafePosture APK
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            SafePosture-debug.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload SafePosture APK
        uses: actions/upload-artifact@v4
        with:
          name: SafePosture-debug
          path: SafePosture-debug.apk
          if-no-files-found: error
