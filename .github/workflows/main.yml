      # ============================================================
      # GRADLE 8.7
      #
      # CACHE COMPLETELY DISABLED
      # This avoids the 400 cache errors seen in your screenshot.
      # ============================================================

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-disabled: true


      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "${ANDROID_HOME}"

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find . -maxdepth 4 -type f | sort


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            clean


      # ============================================================
      # BUILD
      #
      # IMPORTANT:
      # --stacktrace + --info makes the REAL error visible.
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING SAFEPOSTURE"
          echo "=========================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "CHECKING APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not generated."
              exit 1
          fi

          ls -lh "$APK"

          echo ""
          echo "APK FOUND SUCCESSFULLY."


      # ============================================================
      # RENAME
      # ============================================================

      - name: Rename APK
        shell: bash
        run: |
          set -e

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/SafePosture-debug.apk


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload SafePosture APK
        uses: actions/upload-artifact@v4
        with:
          name: SafePosture-APK
          path: app/build/outputs/apk/debug/SafePosture-debug.apk
          if-no-files-found: error
          retention-days: 30
