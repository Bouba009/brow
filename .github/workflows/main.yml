          cat << 'EOF' > app/src/main/java/com/apex/browser/AdManager.kt
          package com.apex.browser

          import android.app.Activity
          import android.content.Context
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.appopen.AppOpenAd
          import com.google.android.gms.ads.interstitial.InterstitialAd
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback

          object AdManager {
              private const val APP_OPEN_AD_ID = "ca-app-pub-7908900046861491/2390254337"
              private const val VIDEO_INTERSTITIAL_ID = "ca-app-pub-7908900046861491/1971451938"
              private const val REGULAR_INTERSTITIAL_ID = "ca-app-pub-7908900046861491/2270086406"

              private var videoInterstitialAd: InterstitialAd? = null
              private var regularInterstitialAd: InterstitialAd? = null
              private var isVideoLoading = false
              private var isRegularLoading = false

              fun init(context: Context) {
                  MobileAds.initialize(context) {}
                  loadVideoInterstitial(context)
                  loadRegularInterstitial(context)
              }

              fun loadAndShowAppOpenAd(activity: Activity) {
                  val request = AdRequest.Builder().build()
                  AppOpenAd.load(
                      activity,
                      APP_OPEN_AD_ID,
                      request,
                      object : AppOpenAd.AppOpenAdLoadCallback() {
                          override fun onAdLoaded(ad: AppOpenAd) {
                              ad.show(activity)
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {}
                      }
                  )
              }

              fun loadVideoInterstitial(context: Context) {
                  if (videoInterstitialAd != null || isVideoLoading) return
                  isVideoLoading = true
                  val request = AdRequest.Builder().build()
                  InterstitialAd.load(
                      context,
                      VIDEO_INTERSTITIAL_ID,
                      request,
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) {
                              videoInterstitialAd = ad
                              isVideoLoading = false
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              videoInterstitialAd = null
                              isVideoLoading = false
                          }
                      }
                  )
              }

              fun showVideoInterstitial(activity: Activity, onFinished: () -> Unit) {
                  val ad = videoInterstitialAd
                  if (ad != null) {
                      ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                          override fun onAdDismissedFullScreenContent() {
                              videoInterstitialAd = null
                              loadVideoInterstitial(activity)
                              onFinished()
                          }
                          override fun onAdFailedToShowFullScreenContent(err: com.google.android.gms.ads.AdError) {
                              videoInterstitialAd = null
                              loadVideoInterstitial(activity)
                              onFinished()
                          }
                      }
                      ad.show(activity)
                  } else {
                      loadVideoInterstitial(activity)
                      onFinished()
                  }
              }

              fun loadRegularInterstitial(context: Context) {
                  if (regularInterstitialAd != null || isRegularLoading) return
                  isRegularLoading = true
                  val request = AdRequest.Builder().build()
                  InterstitialAd.load(
                      context,
                      REGULAR_INTERSTITIAL_ID,
                      request,
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) {
                              regularInterstitialAd = ad
                              isRegularLoading = false
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              regularInterstitialAd = null
                              isRegularLoading = false
                          }
                      }
                  )
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/apex/browser/AlarmScheduler.kt
          package com.apex.browser

          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import java.util.Calendar
          import java.util.TimeZone

          object ChimePlayer {
              private var currentTrack: AudioTrack? = null

              // رنين مستمر مدة 3 ثوانٍ هادئ ونقي (Harmonic Chimes)
              fun playCalmChime3Seconds(context: Context) {
                  stop()
                  Thread {
                      try {
                          val sampleRate = 44100
                          val durationSeconds = 3.0
                          val numSamples = (durationSeconds * sampleRate).toInt()
                          val buffer = ShortArray(numSamples)

                          // درجات نغمية متناسقة فاخرة وغير مزعجة (E5 - G#5 - B5)
                          val freqs = doubleArrayOf(659.25, 830.61, 987.77)
                          for (i in 0 until numSamples) {
                              val t = i.toDouble() / sampleRate
                              var sample = 0.0
                              for ((idx, f) in freqs.withIndex()) {
                                  val noteStart = idx * 0.4
                                  if (t >= noteStart) {
                                      val noteTime = t - noteStart
                                      val envelope = Math.exp(-2.0 * noteTime)
                                      sample += Math.sin(2.0 * Math.PI * f * noteTime) * envelope * 0.35
                                      sample += Math.sin(4.0 * Math.PI * f * noteTime) * envelope * 0.08
                                  }
                              }
                              val fadeOut = if (t > 2.5) (3.0 - t) / 0.5 else 1.0
                              sample *= fadeOut
                              buffer[i] = (sample.coerceIn(-1.0, 1.0) * Short.MAX_VALUE).toInt().toShort()
                          }

                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(buffer.size * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()

                          currentTrack = track
                          track.write(buffer, 0, buffer.size)
                          track.play()
                      } catch (e: Exception) {
                          try {
                              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                              val r = RingtoneManager.getRingtone(context.applicationContext, uri)
                              r?.play()
                          } catch (ignored: Exception) {}
                      }
                  }.start()
              }

              fun stop() {
                  try {
                      currentTrack?.let {
                          if (it.playState == AudioTrack.PLAYSTATE_PLAYING) {
                              it.stop()
                          }
                          it.release()
                      }
                      currentTrack = null
                  } catch (ignored: Exception) {}
              }
          }

          object AlarmScheduler {
              const val ALGERIA_TZ = "Africa/Algiers"

              data class ScheduledAlarm(
                  val reqCode: Int,
                  val dayOfWeek: Int,
                  val hour: Int,
                  val minute: Int,
                  val message: String
              )

              val alarms = listOf(
                  ScheduledAlarm(101, Calendar.TUESDAY, 11, 0, "لا تنسى حجز الموعد يفتح اليوم مساءا"),
                  ScheduledAlarm(102, Calendar.TUESDAY, 16, 30, "تبقى 30 دقيقة على موعد فتح الموقع للحجز اتمنى ان تحجز هذه المرة"),
                  ScheduledAlarm(103, Calendar.FRIDAY, 11, 0, "لا تنسى حجز الموعد يفتح اليوم مساءا"),
                  ScheduledAlarm(104, Calendar.FRIDAY, 16, 30, "تبقى 30 دقيقة على موعد فتح الموقع للحجز اتمنى ان تحجز هذه المرة")
              )

              fun calculateNextTrigger(dayOfWeek: Int, hour: Int, minute: Int): Long {
                  val tz = TimeZone.getTimeZone(ALGERIA_TZ)
                  val now = Calendar.getInstance(tz)

                  val target = Calendar.getInstance(tz).apply {
                      set(Calendar.DAY_OF_WEEK, dayOfWeek)
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }

                  while (target.timeInMillis <= now.timeInMillis) {
                      target.add(Calendar.DAY_OF_YEAR, 7)
                  }

                  return target.timeInMillis
              }

              fun scheduleAllAlarms(context: Context) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                  for (alarm in alarms) {
                      val trigger = calculateNextTrigger(alarm.dayOfWeek, alarm.hour, alarm.minute)
                      setSystemAlarm(context, alarmManager, alarm.reqCode, trigger, alarm.message, alarm.dayOfWeek, alarm.hour, alarm.minute)
                  }
              }

              fun scheduleNextOccurrence(context: Context, reqCode: Int, day: Int, hour: Int, minute: Int, message: String) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                  val trigger = calculateNextTrigger(day, hour, minute)
                  setSystemAlarm(context, alarmManager, reqCode, trigger, message, day, hour, minute)
              }

              private fun setSystemAlarm(
                  context: Context,
                  alarmManager: AlarmManager,
                  reqCode: Int,
                  triggerTimeMillis: Long,
                  message: String,
                  day: Int,
                  hour: Int,
                  minute: Int
              ) {
                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      action = "com.apex.browser.ALARM_$reqCode"
                      putExtra("req_code", reqCode)
                      putExtra("message", message)
                      putExtra("day", day)
                      putExtra("hour", hour)
                      putExtra("minute", minute)
                  }

                  val pi = PendingIntent.getBroadcast(
                      context,
                      reqCode,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val showIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val showPending = PendingIntent.getActivity(
                      context,
                      reqCode,
                      showIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  try {
                      val clockInfo = AlarmManager.AlarmClockInfo(triggerTimeMillis, showPending)
                      alarmManager.setAlarmClock(clockInfo, pi)
                  } catch (e: Exception) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTimeMillis, pi)
                          } else {
                              alarmManager.setExact(AlarmManager.RTC_WAKEUP, triggerTimeMillis, pi)
                          }
                      } catch (e2: Exception) {
                          alarmManager.set(AlarmManager.RTC_WAKEUP, triggerTimeMillis, pi)
                      }
                  }
              }
          }

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val powerManager = context.getSystemService(Context.POWER_SERVICE) as? PowerManager
                  val wakeLock = powerManager?.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK,
                      "ApexBrowser:AlarmWakeLock"
                  )
                  wakeLock?.acquire(10000L)

                  val reqCode = intent.getIntExtra("req_code", 100)
                  val day = intent.getIntExtra("day", Calendar.TUESDAY)
                  val hour = intent.getIntExtra("hour", 11)
                  val minute = intent.getIntExtra("minute", 0)
                  val message = intent.getStringExtra("message") ?: "تنبيه مواعيد الحجز BLS"

                  // تشغيل النغمة الهادئة لمدة 3 ثوانٍ
                  ChimePlayer.playCalmChime3Seconds(context)

                  showNotification(context, reqCode, message)

                  AlarmScheduler.scheduleNextOccurrence(context, reqCode, day, hour, minute, message)
              }

              private fun showNotification(context: Context, notificationId: Int, message: String) {
                  val channelId = "apex_alarm_channel_prod"
                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "مواعيد الحجز BLS",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "تنبيهات مواعيد فتح حجز التأشيرة"
                          enableLights(true)
                          lightColor = android.graphics.Color.CYAN
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 400, 300, 400, 300, 400)
                          lockscreenVisibility = NotificationCompat.VISIBILITY_PUBLIC
                      }
                      manager.createNotificationChannel(channel)
                  }

                  val openIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val openPendingIntent = PendingIntent.getActivity(
                      context,
                      notificationId,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val dismissIntent = Intent(context, NotificationDismissReceiver::class.java).apply {
                      putExtra("notif_id", notificationId)
                  }
                  val dismissPendingIntent = PendingIntent.getBroadcast(
                      context,
                      notificationId,
                      dismissIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle("ApexBrowser - تذكير الحجز")
                      .setContentText(message)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(message))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setVibrate(longArrayOf(0, 400, 300, 400, 300, 400))
                      .setContentIntent(openPendingIntent)
                      .setFullScreenIntent(openPendingIntent, true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إغلاق", dismissPendingIntent)
                      .build()

                  manager.notify(notificationId, notification)
              }
          }

          class NotificationDismissReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  ChimePlayer.stop()
                  val notifId = intent.getIntExtra("notif_id", -1)
                  if (notifId != -1) {
                      val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.cancel(notifId)
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == Intent.ACTION_MY_PACKAGE_REPLACED) {
                      AlarmScheduler.scheduleAllAlarms(context)
                  }
              }
          }
          EOF

