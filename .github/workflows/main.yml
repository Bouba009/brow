          @Composable
          fun ExerciseCard(
              exercise: Exercise
          ) {

              var seconds by remember {
                  mutableIntStateOf(
                      exercise.seconds
                  )
              }

              var running by remember {
                  mutableStateOf(false)
              }

              LaunchedEffect(running) {

                  while (
                      running &&
                      seconds > 0
                  ) {

                      delay(1000)

                      seconds--
                  }

                  if (seconds <= 0) {
                      running = false
                  }
              }

              Column(
                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .clip(
                              RoundedCornerShape(24.dp)
                          )
                          .background(
                              SurfaceColor
                          )
                          .padding(18.dp)
              ) {

                  Text(
                      exercise.title,
                      color = White,
                      fontSize = 20.sp,
                      fontWeight =
                          FontWeight.Bold
                  )

                  Spacer(
                      Modifier.height(12.dp)
                  )

                  ExerciseCanvas(
                      type = exercise.type
                  )

                  Spacer(
                      Modifier.height(12.dp)
                  )

                  Text(
                      exercise.description,
                      color = White,
                      fontSize = 14.sp
                  )

                  Spacer(
                      Modifier.height(10.dp)
                  )

                  Text(
                      "TARGET: ${exercise.muscle}",
                      color = Green,
                      fontSize = 12.sp,
                      fontWeight =
                          FontWeight.Bold
                  )

                  Spacer(
                      Modifier.height(6.dp)
                  )

                  Text(
                      "COMMON MISTAKE: ${exercise.mistake}",
                      color = Gray,
                      fontSize = 12.sp
                  )

                  Spacer(
                      Modifier.height(16.dp)
                  )

                  Text(
                      "${seconds}s",
                      color = White,
                      fontSize = 28.sp,
                      fontWeight =
                          FontWeight.Bold,
                      modifier =
                          Modifier.align(
                              Alignment.CenterHorizontally
                          )
                  )

                  Spacer(
                      Modifier.height(10.dp)
                  )

                  Row(
                      modifier =
                          Modifier.fillMaxWidth(),
                      horizontalArrangement =
                          Arrangement.spacedBy(10.dp)
                  ) {

                      Button(
                          onClick = {

                              if (seconds <= 0) {
                                  seconds =
                                      exercise.seconds
                              }

                              running = !running
                          },
                          modifier =
                              Modifier.weight(1f),
                          colors =
                              ButtonDefaults.buttonColors(
                                  containerColor =
                                      Green,
                                  contentColor =
                                      Background
                              )
                      ) {

                          Icon(
                              Icons.Default.PlayArrow,
                              contentDescription =
                                  null
                          )

                          Spacer(
                              Modifier.width(5.dp)
                          )

                          Text(
                              if (running)
                                  "Pause"
                              else
                                  "Start"
                          )
                      }

                      Button(
                          onClick = {

                              running = false

                              seconds =
                                  exercise.seconds
                          },
                          modifier =
                              Modifier.weight(1f),
                          colors =
                              ButtonDefaults.buttonColors(
                                  containerColor =
                                      Surface2,
                                  contentColor =
                                      White
                              )
                      ) {

                          Text("Reset")
                      }
                  }
              }
          }


