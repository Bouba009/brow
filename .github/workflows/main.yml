          @Composable
          fun ExerciseCard(
              exercise: Exercise
          ) {

              var remaining by remember {
                  mutableIntStateOf(
                      exercise.seconds
                  )
              }

              var running by remember {
                  mutableStateOf(false)
              }

              LaunchedEffect(running) {

                  while (
                      running &&
                      remaining > 0
                  ) {

                      delay(1000)

                      remaining -= 1
                  }

                  if (remaining <= 0) {
                      running = false
                  }
              }

              Column(
                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .clip(
                              RoundedCornerShape(24.dp)
                          )
                          .background(
                              SurfaceColor
                          )
                          .padding(18.dp)
              ) {

                  Text(
                      text = exercise.title,
                      color = White,
                      fontSize = 20.sp,
                      fontWeight =
                          FontWeight.Bold
                  )

                  Spacer(
                      modifier =
                          Modifier.height(14.dp)
                  )

                  ExerciseIllustration(
                      type = exercise.type
                  )

                  Spacer(
                      modifier =
                          Modifier.height(14.dp)
                  )

                  Text(
                      text =
                          exercise.description,
                      color = White,
                      fontSize = 14.sp,
                      lineHeight = 21.sp
                  )

                  Spacer(
                      modifier =
                          Modifier.height(12.dp)
                  )

                  Text(
                      text = "TARGET MUSCLE",
                      color = Emerald,
                      fontSize = 10.sp,
                      fontWeight =
                          FontWeight.Bold
                  )

                  Text(
                      text = exercise.muscle,
                      color = White,
                      fontSize = 13.sp,
                      modifier =
                          Modifier.padding(
                              top = 3.dp
                          )
                  )

                  Spacer(
                      modifier =
                          Modifier.height(12.dp)
                  )

                  Text(
                      text = "COMMON MISTAKE",
                      color = WarningRed,
                      fontSize = 10.sp,
                      fontWeight =
                          FontWeight.Bold
                  )

                  Text(
                      text = exercise.mistake,
                      color = Gray,
                      fontSize = 13.sp,
                      modifier =
                          Modifier.padding(
                              top = 3.dp
                          )
                  )

                  Spacer(
                      modifier =
                          Modifier.height(18.dp)
                  )

                  Text(
                      text = "${remaining}s",
                      color = White,
                      fontSize = 28.sp,
                      fontWeight =
                          FontWeight.Bold,
                      modifier =
                          Modifier.align(
                              Alignment.CenterHorizontally
                          )
                  )

                  Spacer(
                      modifier =
                          Modifier.height(10.dp)
                  )

                  Row(
                      modifier =
                          Modifier.fillMaxWidth(),
                      horizontalArrangement =
                          Arrangement.spacedBy(10.dp)
                  ) {

                      Button(
                          onClick = {

                              if (remaining <= 0) {
                                  remaining =
                                      exercise.seconds
                              }

                              running = !running
                          },
                          modifier =
                              Modifier.weight(1f),
                          shape =
                              RoundedCornerShape(14.dp),
                          colors =
                              ButtonDefaults.buttonColors(
                                  containerColor =
                                      Emerald,
                                  contentColor =
                                      DarkBackground
                              )
                      ) {

                          Icon(
                              imageVector =
                                  Icons.Default.PlayArrow,
                              contentDescription = null
                          )

                          Spacer(
                              modifier =
                                  Modifier.width(5.dp)
                          )

                          Text(
                              text =
                                  if (running) {
                                      "Pause"
                                  } else {
                                      "Start"
                                  },
                              fontWeight =
                                  FontWeight.Bold
                          )
                      }

                      Button(
                          onClick = {

                              running = false

                              remaining =
                                  exercise.seconds
                          },
                          modifier =
                              Modifier.weight(1f),
                          shape =
                              RoundedCornerShape(14.dp),
                          colors =
                              ButtonDefaults.buttonColors(
                                  containerColor =
                                      SurfaceColor2,
                                  contentColor =
                                      White
                              )
                      ) {

                          Text("Reset")
                      }
                  }
              }
          }

