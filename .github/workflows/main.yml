          echo "======================================"
          echo "Gradle version"
          echo "======================================"
          gradle --version

          echo ""
          echo "======================================"
          echo "Android SDK"
          echo "======================================"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      # ============================================================
      # 9. Build APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # ============================================================
      # 10. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK_PATH"

      # ============================================================
      # 11. Rename APK
      # ============================================================
      - name: Rename APK
        shell: bash
        run: |
          set -e

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/SafePosture-debug.apk

          echo "SafePosture-debug.apk created."

      # ============================================================
      # 12. Upload APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafePosture-APK
          path: app/build/outputs/apk/debug/SafePosture-debug.apk
          if-no-files-found: error
          retention-days: 30
