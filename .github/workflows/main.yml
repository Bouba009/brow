name: Build ApexBrowser Store Release

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Production Bundle (AAB) & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Create Release Signing Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias apexkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass apexkeystorepass -keypass apexkeystorepass \
            -dname "CN=ApexBrowser, OU=Production, O=ApexBrowser, L=Algiers, ST=Algiers, C=DZ"

      - name: Generate Android Project Structure & Source Code
        run: |
          set -e

          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/apex/browser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF_GRADLE_PROPERTIES' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_GRADLE_PROPERTIES

          cat << 'EOF_SETTINGS_GRADLE' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ApexBrowser"
          include(":app")
          EOF_SETTINGS_GRADLE

          cat << 'EOF_ROOT_BUILD' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF_ROOT_BUILD

          cat << 'EOF_APP_BUILD' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.apex.browser"
              compileSdk = 34

              signingConfigs {
                  create("release") {
                      storeFile = file("${rootProject.projectDir}/release.jks")
                      storePassword = "apexkeystorepass"
                      keyAlias = "apexkey"
                      keyPassword = "apexkeystorepass"
                  }
              }

              defaultConfig {
                  applicationId = "com.apex.browser"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              // WebKit المتقدمة للتحكم في Client Hints وإلغاء X-Requested-With
              implementation("androidx.webkit:webkit:1.10.0")

              implementation("com.google.android.gms:play-services-ads:23.0.0")
          }
          EOF_APP_BUILD

          touch app/proguard-rules.pro

          cat << 'EOF_STRINGS' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ApexBrowser</string>
          </resources>
          EOF_STRINGS

          cat << 'EOF_LOGO' > app/src/main/res/drawable/ic_browser_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FF38BDF8"
                  android:pathData="M54,20c-18.78,0 -34,15.22 -34,34s15.22,34 34,34 34,-15.22 34,-34 -15.22,-34 -34,-34zM54,82c-15.46,0 -28,-12.54 -28,-28s12.54,-28 28,-28 28,12.54 28,28 -12.54,28 -28,28z"/>
              <path
                  android:fillColor="#FF38BDF8"
                  android:pathData="M52,32l-14,24h10l-4,18l18,-24h-10z"/>
          </vector>
          EOF_LOGO

          cat << 'EOF_NOTIF' > app/src/main/res/drawable/ic_notification.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          EOF_NOTIF

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:name=".ApexApp"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_browser_logo"
                  android:roundIcon="@drawable/ic_browser_logo"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-7908900046861491~8143132483"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <receiver android:name=".NotificationDismissReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

              </application>

          </manifest>
          EOF_MANIFEST

          cat << 'EOF_CONFIG_MGR' > app/src/main/java/com/apex/browser/RemoteConfigManager.kt
          package com.apex.browser

          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object RemoteConfigManager {
              var configUrl = "https://gist.githubusercontent.com/raw/apex_browser_config.json"

              var adsEnabled by mutableStateOf(true)
              var showBanner by mutableStateOf(false)
              var clicksBetweenInterstitials by mutableIntStateOf(5)
              var bannerAdId by mutableStateOf("ca-app-pub-7908900046861491/2270086406")
              var interstitialAdId by mutableStateOf("ca-app-pub-7908900046861491/2270086406")
              var videoInterstitialId by mutableStateOf("ca-app-pub-7908900046861491/1971451938")
              var appOpenAdId by mutableStateOf("ca-app-pub-7908900046861491/2390254337")
              var defaultUrl by mutableStateOf("https://algeria.blsinternational.com/login")
              var alarmMsg11am by mutableStateOf("لا تنسى حجز الموعد يفتح اليوم مساءا")
              var alarmMsg430pm by mutableStateOf("تبقى 30 دقيقة على موعد فتح الموقع للحجز اتمنى ان تحجز هذه المرة")

              fun init(context: Context) {
                  loadCachedConfig(context)
                  fetchRemoteConfig(context)
              }

              private fun loadCachedConfig(context: Context) {
                  val prefs = context.getSharedPreferences("apex_remote_config", Context.MODE_PRIVATE)
                  adsEnabled = prefs.getBoolean("ads_enabled", adsEnabled)
                  showBanner = prefs.getBoolean("show_banner", showBanner)
                  clicksBetweenInterstitials = prefs.getInt("clicks_between_interstitials", clicksBetweenInterstitials)
                  bannerAdId = prefs.getString("banner_ad_id", bannerAdId) ?: bannerAdId
                  interstitialAdId = prefs.getString("interstitial_ad_id", interstitialAdId) ?: interstitialAdId
                  videoInterstitialId = prefs.getString("video_interstitial_id", videoInterstitialId) ?: videoInterstitialId
                  appOpenAdId = prefs.getString("app_open_ad_id", appOpenAdId) ?: appOpenAdId
                  defaultUrl = prefs.getString("default_url", defaultUrl) ?: defaultUrl
                  alarmMsg11am = prefs.getString("alarm_msg_11am", alarmMsg11am) ?: alarmMsg11am
                  alarmMsg430pm = prefs.getString("alarm_msg_430pm", alarmMsg430pm) ?: alarmMsg430pm
              }

              fun fetchRemoteConfig(context: Context) {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val url = URL(configUrl)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 5000
                          conn.readTimeout = 5000
                          conn.requestMethod = "GET"

                          if (conn.responseCode == 200) {
                              val jsonStr = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(jsonStr)

                              adsEnabled = json.optBoolean("ads_enabled", adsEnabled)
                              showBanner = json.optBoolean("show_banner", showBanner)
                              clicksBetweenInterstitials = json.optInt("clicks_between_interstitials", clicksBetweenInterstitials)
                              bannerAdId = json.optString("banner_ad_id", bannerAdId)
                              interstitialAdId = json.optString("interstitial_ad_id", interstitialAdId)
                              videoInterstitialId = json.optString("video_interstitial_id", videoInterstitialId)
                              appOpenAdId = json.optString("app_open_ad_id", appOpenAdId)
                              defaultUrl = json.optString("default_url", defaultUrl)
                              alarmMsg11am = json.optString("alarm_msg_11am", alarmMsg11am)
                              alarmMsg430pm = json.optString("alarm_msg_430pm", alarmMsg430pm)

                              val prefs = context.getSharedPreferences("apex_remote_config", Context.MODE_PRIVATE)
                              prefs.edit()
                                  .putBoolean("ads_enabled", adsEnabled)
                                  .putBoolean("show_banner", showBanner)
                                  .putInt("clicks_between_interstitials", clicksBetweenInterstitials)
                                  .putString("banner_ad_id", bannerAdId)
                                  .putString("interstitial_ad_id", interstitialAdId)
                                  .putString("video_interstitial_id", videoInterstitialId)
                                  .putString("app_open_ad_id", appOpenAdId)
                                  .putString("default_url", defaultUrl)
                                  .putString("alarm_msg_11am", alarmMsg11am)
                                  .putString("alarm_msg_430pm", alarmMsg430pm)
                                  .apply()
                          }
                      } catch (ignored: Exception) {}
                  }
              }
          }
          EOF_CONFIG_MGR

          cat << 'EOF_APEX_APP' > app/src/main/java/com/apex/browser/ApexApp.kt
          package com.apex.browser

          import android.app.Activity
          import android.app.Application
          import android.os.Bundle

          class ApexApp : Application(), Application.ActivityLifecycleCallbacks {
              private var currentActivity: Activity? = null
              private var activityCount = 0
              private var isAppInForeground = false

              override fun onCreate() {
                  super.onCreate()
                  registerActivityLifecycleCallbacks(this)
                  RemoteConfigManager.init(this)
                  AdManager.init(this)
                  AlarmScheduler.scheduleAllAlarms(this)
              }

              override fun onActivityStarted(activity: Activity) {
                  currentActivity = activity
                  activityCount++
                  if (activityCount == 1 && !isAppInForeground) {
                      isAppInForeground = true
                      AdManager.showAppOpenAdIfAvailable(activity)
                  }
              }

              override fun onActivityStopped(activity: Activity) {
                  activityCount--
                  if (activityCount <= 0) {
                      activityCount = 0
                      isAppInForeground = false
                  }
              }

              override fun onActivityResumed(activity: Activity) {
                  currentActivity = activity
              }

              override fun onActivityPaused(activity: Activity) {}
              override fun onActivityCreated(activity: Activity, savedInstanceState: Bundle?) {}
              override fun onActivitySaveInstanceState(activity: Activity, outState: Bundle) {}
              override fun onActivityDestroyed(activity: Activity) {
                  if (currentActivity == activity) {
                      currentActivity = null
                  }
              }
          }
          EOF_APEX_APP

          cat << 'EOF_AD_MANAGER' > app/src/main/java/com/apex/browser/AdManager.kt
          package com.apex.browser

          import android.app.Activity
          import android.content.Context
          import android.widget.Toast
          import com.google.android.gms.ads.AdError
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.appopen.AppOpenAd
          import com.google.android.gms.ads.interstitial.InterstitialAd
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback

          object AdManager {
              private var appOpenAd: AppOpenAd? = null
              private var isAppOpenLoading = false
              private var appOpenLoadTime: Long = 0

              private var videoInterstitialAd: InterstitialAd? = null
              private var isVideoLoading = false

              private var regularInterstitialAd: InterstitialAd? = null
              private var isRegularLoading = false

              var isShowingAd = false

              fun init(context: Context) {
                  MobileAds.initialize(context) {}
                  loadAppOpenAd(context)
                  loadVideoInterstitial(context)
                  loadRegularInterstitial(context)
              }

              private fun isAppOpenAdAvailable(): Boolean {
                  return appOpenAd != null && (System.currentTimeMillis() - appOpenLoadTime) < (4 * 3600 * 1000L)
              }

              fun loadAppOpenAd(context: Context) {
                  if (!RemoteConfigManager.adsEnabled || isAppOpenLoading || isAppOpenAdAvailable()) return
                  isAppOpenLoading = true

                  val request = AdRequest.Builder().build()
                  AppOpenAd.load(
                      context,
                      RemoteConfigManager.appOpenAdId,
                      request,
                      object : AppOpenAd.AppOpenAdLoadCallback() {
                          override fun onAdLoaded(ad: AppOpenAd) {
                              appOpenAd = ad
                              isAppOpenLoading = false
                              appOpenLoadTime = System.currentTimeMillis()
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              isAppOpenLoading = false
                              appOpenAd = null
                          }
                      }
                  )
              }

              fun showAppOpenAdIfAvailable(activity: Activity) {
                  if (!RemoteConfigManager.adsEnabled || isShowingAd) return

                  if (!isAppOpenAdAvailable()) {
                      loadAppOpenAd(activity)
                      return
                  }

                  appOpenAd?.fullScreenContentCallback = object : FullScreenContentCallback() {
                      override fun onAdDismissedFullScreenContent() {
                          appOpenAd = null
                          isShowingAd = false
                          loadAppOpenAd(activity)
                      }
                      override fun onAdFailedToShowFullScreenContent(err: AdError) {
                          appOpenAd = null
                          isShowingAd = false
                          loadAppOpenAd(activity)
                      }
                      override fun onAdShowedFullScreenContent() {
                          isShowingAd = true
                      }
                  }
                  isShowingAd = true
                  appOpenAd?.show(activity)
              }

              fun loadAndShowAppOpenAdFirstTime(activity: Activity) {
                  if (!RemoteConfigManager.adsEnabled || isShowingAd) return
                  if (isAppOpenAdAvailable()) {
                      showAppOpenAdIfAvailable(activity)
                      return
                  }
                  isAppOpenLoading = true
                  val request = AdRequest.Builder().build()
                  AppOpenAd.load(
                      activity,
                      RemoteConfigManager.appOpenAdId,
                      request,
                      object : AppOpenAd.AppOpenAdLoadCallback() {
                          override fun onAdLoaded(ad: AppOpenAd) {
                              appOpenAd = ad
                              isAppOpenLoading = false
                              appOpenLoadTime = System.currentTimeMillis()
                              showAppOpenAdIfAvailable(activity)
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              isAppOpenLoading = false
                          }
                      }
                  )
              }

              fun loadVideoInterstitial(context: Context, onLoaded: (() -> Unit)? = null) {
                  if (!RemoteConfigManager.adsEnabled || videoInterstitialAd != null) {
                      onLoaded?.invoke()
                      return
                  }
                  if (isVideoLoading) return
                  isVideoLoading = true

                  val request = AdRequest.Builder().build()
                  InterstitialAd.load(
                      context,
                      RemoteConfigManager.videoInterstitialId,
                      request,
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) {
                              videoInterstitialAd = ad
                              isVideoLoading = false
                              onLoaded?.invoke()
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              videoInterstitialAd = null
                              isVideoLoading = false
                          }
                      }
                  )
              }

              fun loadRegularInterstitial(context: Context, onLoaded: (() -> Unit)? = null) {
                  if (!RemoteConfigManager.adsEnabled || regularInterstitialAd != null) {
                      onLoaded?.invoke()
                      return
                  }
                  if (isRegularLoading) return
                  isRegularLoading = true

                  val request = AdRequest.Builder().build()
                  InterstitialAd.load(
                      context,
                      RemoteConfigManager.interstitialAdId,
                      request,
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) {
                              regularInterstitialAd = ad
                              isRegularLoading = false
                              onLoaded?.invoke()
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              regularInterstitialAd = null
                              isRegularLoading = false
                          }
                      }
                  )
              }

              fun showAdForAutoClick(activity: Activity, onAdCompleted: () -> Unit) {
                  if (!RemoteConfigManager.adsEnabled) {
                      onAdCompleted()
                      return
                  }

                  if (videoInterstitialAd != null) {
                      val ad = videoInterstitialAd!!
                      ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                          override fun onAdDismissedFullScreenContent() {
                              videoInterstitialAd = null
                              isShowingAd = false
                              loadVideoInterstitial(activity)
                              onAdCompleted()
                          }
                          override fun onAdFailedToShowFullScreenContent(err: AdError) {
                              videoInterstitialAd = null
                              isShowingAd = false
                              loadVideoInterstitial(activity)
                              showFallbackInterstitial(activity, onAdCompleted)
                          }
                          override fun onAdShowedFullScreenContent() {
                              isShowingAd = true
                          }
                      }
                      ad.show(activity)
                      return
                  }

                  Toast.makeText(activity, "جاري تحضير الإعلان...", Toast.LENGTH_SHORT).show()
                  val request = AdRequest.Builder().build()
                  InterstitialAd.load(
                      activity,
                      RemoteConfigManager.videoInterstitialId,
                      request,
                      object : InterstitialAdLoadCallback() {
                          override fun onAdLoaded(ad: InterstitialAd) {
                              ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                                  override fun onAdDismissedFullScreenContent() {
                                      isShowingAd = false
                                      loadVideoInterstitial(activity)
                                      onAdCompleted()
                                  }
                                  override fun onAdFailedToShowFullScreenContent(err: AdError) {
                                      isShowingAd = false
                                      showFallbackInterstitial(activity, onAdCompleted)
                                  }
                                  override fun onAdShowedFullScreenContent() {
                                      isShowingAd = true
                                  }
                              }
                              ad.show(activity)
                          }
                          override fun onAdFailedToLoad(error: LoadAdError) {
                              showFallbackInterstitial(activity, onAdCompleted)
                          }
                      }
                  )
              }

              private fun showFallbackInterstitial(activity: Activity, onAdCompleted: () -> Unit) {
                  if (!RemoteConfigManager.adsEnabled) {
                      onAdCompleted()
                      return
                  }

                  if (regularInterstitialAd != null) {
                      val ad = regularInterstitialAd!!
                      ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                          override fun onAdDismissedFullScreenContent() {
                              regularInterstitialAd = null
                              isShowingAd = false
                              loadRegularInterstitial(activity)
                              onAdCompleted()
                          }
                          override fun onAdFailedToShowFullScreenContent(err: AdError) {
                              regularInterstitialAd = null
                              isShowingAd = false
                              loadRegularInterstitial(activity)
                              onAdCompleted()
                          }
                          override fun onAdShowedFullScreenContent() {
                              isShowingAd = true
                          }
                      }
                      ad.show(activity)
                  } else {
                      val request = AdRequest.Builder().build()
                      InterstitialAd.load(
                          activity,
                          RemoteConfigManager.interstitialAdId,
                          request,
                          object : InterstitialAdLoadCallback() {
                              override fun onAdLoaded(ad: InterstitialAd) {
                                  ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                                      override fun onAdDismissedFullScreenContent() {
                                          isShowingAd = false
                                          loadRegularInterstitial(activity)
                                          onAdCompleted()
                                      }
                                      override fun onAdFailedToShowFullScreenContent(err: AdError) {
                                          isShowingAd = false
                                          loadRegularInterstitial(activity)
                                          onAdCompleted()
                                      }
                                      override fun onAdShowedFullScreenContent() {
                                          isShowingAd = true
                                      }
                                  }
                                  ad.show(activity)
                              }
                              override fun onAdFailedToLoad(error: LoadAdError) {
                                  onAdCompleted()
                              }
                          }
                      )
                  }
              }

              fun showGeneralInterstitial(activity: Activity, onFinished: () -> Unit = {}) {
                  showFallbackInterstitial(activity, onFinished)
              }
          }
          EOF_AD_MANAGER

          cat << 'EOF_ALARM_SCHEDULER' > app/src/main/java/com/apex/browser/AlarmScheduler.kt
          package com.apex.browser

          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import java.util.Calendar
          import java.util.TimeZone

          object ChimePlayer {
              private var currentTrack: AudioTrack? = null

              fun playCalmChime3Seconds(context: Context) {
                  stop()
                  Thread {
                      try {
                          val sampleRate = 44100
                          val durationSeconds = 3.0
                          val numSamples = (durationSeconds * sampleRate).toInt()
                          val buffer = ShortArray(numSamples)

                          val freqs = doubleArrayOf(659.25, 830.61, 987.77)
                          for (i in 0 until numSamples) {
                              val t = i.toDouble() / sampleRate
                              var sample = 0.0
                              for ((idx, f) in freqs.withIndex()) {
                                  val noteStart = idx * 0.4
                                  if (t >= noteStart) {
                                      val noteTime = t - noteStart
                                      val envelope = Math.exp(-2.0 * noteTime)
                                      sample += Math.sin(2.0 * Math.PI * f * noteTime) * envelope * 0.35
                                      sample += Math.sin(4.0 * Math.PI * f * noteTime) * envelope * 0.08
                                  }
                              }
                              val fadeOut = if (t > 2.5) (3.0 - t) / 0.5 else 1.0
                              sample *= fadeOut
                              buffer[i] = (sample.coerceIn(-1.0, 1.0) * Short.MAX_VALUE).toInt().toShort()
                          }

                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(buffer.size * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()

                          currentTrack = track
                          track.write(buffer, 0, buffer.size)
                          track.play()
                      } catch (e: Exception) {
                          try {
                              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                              val r = RingtoneManager.getRingtone(context.applicationContext, uri)
                              r?.play()
                          } catch (ignored: Exception) {}
                      }
                  }.start()
              }

              fun stop() {
                  try {
                      currentTrack?.let {
                          if (it.playState == AudioTrack.PLAYSTATE_PLAYING) {
                              it.stop()
                          }
                          it.release()
                      }
                      currentTrack = null
                  } catch (ignored: Exception) {}
              }
          }

          object AlarmScheduler {
              const val ALGERIA_TZ = "Africa/Algiers"

              data class ScheduledAlarm(
                  val reqCode: Int,
                  val dayOfWeek: Int,
                  val hour: Int,
                  val minute: Int,
                  val defaultMessage: String
              )

              val alarms = listOf(
                  ScheduledAlarm(101, Calendar.TUESDAY, 11, 0, "لا تنسى حجز الموعد يفتح اليوم مساءا"),
                  ScheduledAlarm(102, Calendar.TUESDAY, 16, 30, "تبقى 30 دقيقة على موعد فتح الموقع للحجز اتمنى ان تحجز هذه المرة"),
                  ScheduledAlarm(103, Calendar.FRIDAY, 11, 0, "لا تنسى حجز الموعد يفتح اليوم مساءا"),
                  ScheduledAlarm(104, Calendar.FRIDAY, 16, 30, "تبقى 30 دقيقة على موعد فتح الموقع للحجز اتمنى ان تحجز هذه المرة")
              )

              fun calculateNextTrigger(dayOfWeek: Int, hour: Int, minute: Int): Long {
                  val tz = TimeZone.getTimeZone(ALGERIA_TZ)
                  val now = Calendar.getInstance(tz)

                  val target = Calendar.getInstance(tz).apply {
                      set(Calendar.DAY_OF_WEEK, dayOfWeek)
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }

                  while (target.timeInMillis <= now.timeInMillis) {
                      target.add(Calendar.DAY_OF_YEAR, 7)
                  }

                  return target.timeInMillis
              }

              fun scheduleAllAlarms(context: Context) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                  for (alarm in alarms) {
                      val trigger = calculateNextTrigger(alarm.dayOfWeek, alarm.hour, alarm.minute)
                      val msg = if (alarm.hour == 11) RemoteConfigManager.alarmMsg11am else RemoteConfigManager.alarmMsg430pm
                      setSystemAlarm(context, alarmManager, alarm.reqCode, trigger, msg, alarm.dayOfWeek, alarm.hour, alarm.minute)
                  }
              }

              fun scheduleNextOccurrence(context: Context, reqCode: Int, day: Int, hour: Int, minute: Int) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                  val trigger = calculateNextTrigger(day, hour, minute)
                  val msg = if (hour == 11) RemoteConfigManager.alarmMsg11am else RemoteConfigManager.alarmMsg430pm
                  setSystemAlarm(context, alarmManager, reqCode, trigger, msg, day, hour, minute)
              }

              private fun setSystemAlarm(
                  context: Context,
                  alarmManager: AlarmManager,
                  reqCode: Int,
                  triggerTimeMillis: Long,
                  message: String,
                  day: Int,
                  hour: Int,
                  minute: Int
              ) {
                  val intent = Intent(context, AlarmReceiver::class.java).apply {
                      action = "com.apex.browser.ALARM_$reqCode"
                      putExtra("req_code", reqCode)
                      putExtra("message", message)
                      putExtra("day", day)
                      putExtra("hour", hour)
                      putExtra("minute", minute)
                  }

                  val pi = PendingIntent.getBroadcast(
                      context,
                      reqCode,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val showIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val showPending = PendingIntent.getActivity(
                      context,
                      reqCode,
                      showIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  try {
                      val clockInfo = AlarmManager.AlarmClockInfo(triggerTimeMillis, showPending)
                      alarmManager.setAlarmClock(clockInfo, pi)
                  } catch (e: Exception) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTimeMillis, pi)
                          } else {
                              alarmManager.setExact(AlarmManager.RTC_WAKEUP, triggerTimeMillis, pi)
                          }
                      } catch (e2: Exception) {
                          alarmManager.set(AlarmManager.RTC_WAKEUP, triggerTimeMillis, pi)
                      }
                  }
              }
          }

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val powerManager = context.getSystemService(Context.POWER_SERVICE) as? PowerManager
                  val wakeLock = powerManager?.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK,
                      "ApexBrowser:AlarmWakeLock"
                  )
                  wakeLock?.acquire(10000L)

                  val reqCode = intent.getIntExtra("req_code", 100)
                  val day = intent.getIntExtra("day", Calendar.TUESDAY)
                  val hour = intent.getIntExtra("hour", 11)
                  val minute = intent.getIntExtra("minute", 0)
                  val message = intent.getStringExtra("message") ?: "تنبيه مواعيد الحجز BLS"

                  ChimePlayer.playCalmChime3Seconds(context)
                  showNotification(context, reqCode, message)

                  AlarmScheduler.scheduleNextOccurrence(context, reqCode, day, hour, minute)
              }

              private fun showNotification(context: Context, notificationId: Int, message: String) {
                  val channelId = "apex_alarm_channel_prod"
                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "مواعيد الحجز BLS",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "تنبيهات مواعيد فتح حجز التأشيرة"
                          enableLights(true)
                          lightColor = android.graphics.Color.CYAN
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 400, 300, 400, 300, 400)
                          lockscreenVisibility = NotificationCompat.VISIBILITY_PUBLIC
                      }
                      manager.createNotificationChannel(channel)
                  }

                  val openIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val openPendingIntent = PendingIntent.getActivity(
                      context,
                      notificationId,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val dismissIntent = Intent(context, NotificationDismissReceiver::class.java).apply {
                      putExtra("notif_id", notificationId)
                  }
                  val dismissPendingIntent = PendingIntent.getBroadcast(
                      context,
                      notificationId,
                      dismissIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle("ApexBrowser - تذكير الحجز")
                      .setContentText(message)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(message))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setVibrate(longArrayOf(0, 400, 300, 400, 300, 400))
                      .setContentIntent(openPendingIntent)
                      .setFullScreenIntent(openPendingIntent, true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إغلاق", dismissPendingIntent)
                      .build()

                  manager.notify(notificationId, notification)
              }
          }

          class NotificationDismissReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  ChimePlayer.stop()
                  val notifId = intent.getIntExtra("notif_id", -1)
                  if (notifId != -1) {
                      val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.cancel(notifId)
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == Intent.ACTION_MY_PACKAGE_REPLACED) {
                      AlarmScheduler.scheduleAllAlarms(context)
                  }
              }
          }
