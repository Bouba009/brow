name: Build ApexBrowser APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate & Build ApexBrowser (Stealth Edition)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Android Project Structure & Source Code
        run: |
          set -e

          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/apex/browser
          mkdir -p app/src/main/res/values

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ApexBrowser"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.apex.browser"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.apex.browser"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              // مكتبة webkit للتحكم بالـ Headers المتقدمة وإخفاء X-Requested-With
              implementation("androidx.webkit:webkit:1.10.0")
          }
          EOF

          touch app/proguard-rules.pro

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ApexBrowser</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/apex/browser/MainActivity.kt
          package com.apex.browser

          import android.annotation.SuppressLint
          import android.graphics.Bitmap
          import android.net.http.SslError
          import android.os.Bundle
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.SslErrorHandler
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalSoftwareKeyboardController
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.webkit.WebSettingsCompat
          import androidx.webkit.WebViewFeature
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.isActive
          import java.net.URLEncoder
          import kotlin.math.roundToInt

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      ApexBrowserApp()
                  }
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun ApexBrowserApp() {
              val context = LocalContext.current
              val keyboardController = LocalSoftwareKeyboardController.current

              var currentUrl by remember { mutableStateOf("https://www.google.com") }
              var inputUrl by remember { mutableStateOf("https://www.google.com") }
              var pageTitle by remember { mutableStateOf("ApexBrowser") }
              var progress by remember { mutableStateOf(0f) }
              var isLoading by remember { mutableStateOf(false) }
              var canGoBack by remember { mutableStateOf(false) }
              var canGoForward by remember { mutableStateOf(false) }
              var isDesktopMode by remember { mutableStateOf(false) }

              var webViewInstance by remember { mutableStateOf<WebView?>(null) }

              var hudExpanded by remember { mutableStateOf(false) }
              var bubbleOffset by remember { mutableStateOf(Offset(40f, 250f)) }

              var autoRefreshEnabled by remember { mutableStateOf(false) }
              var autoRefreshInterval by remember { mutableStateOf(15) }
              var countdownSeconds by remember { mutableStateOf(15) }

              var autoClickerEnabled by remember { mutableStateOf(false) }
              var clickIntervalMs by remember { mutableStateOf(1000L) }
              var reticleOffset by remember { mutableStateOf(Offset(250f, 400f)) }
              var isPulsing by remember { mutableStateOf(false) }

              // User-Agents حقيقية تماماً تحاكي متصفح Chrome الأصلي بدون علامات WebView
              val cleanMobileUA = "Mozilla/5.0 (Linux; Android 14; Mobile; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
              val cleanDesktopUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

              BackHandler(enabled = canGoBack) {
                  webViewInstance?.let {
                      if (it.canGoBack()) it.goBack()
                  }
              }

              LaunchedEffect(autoRefreshEnabled, autoRefreshInterval) {
                  if (autoRefreshEnabled) {
                      countdownSeconds = autoRefreshInterval
                      while (isActive && autoRefreshEnabled) {
                          delay(1000L)
                          if (countdownSeconds > 1) {
                              countdownSeconds -= 1
                          } else {
                              countdownSeconds = autoRefreshInterval
                              webViewInstance?.reload()
                          }
                      }
                  } else {
                      countdownSeconds = autoRefreshInterval
                  }
              }

              LaunchedEffect(autoClickerEnabled, clickIntervalMs, reticleOffset) {
                  if (autoClickerEnabled) {
                      while (isActive && autoClickerEnabled) {
                          delay(clickIntervalMs)
                          webViewInstance?.let { wv ->
                              val downTime = SystemClock.uptimeMillis()
                              val eventTime = SystemClock.uptimeMillis()
                              val targetX = reticleOffset.x
                              val targetY = reticleOffset.y

                              val downEvent = MotionEvent.obtain(downTime, eventTime, MotionEvent.ACTION_DOWN, targetX, targetY, 0)
                              val upEvent = MotionEvent.obtain(downTime, eventTime + 30, MotionEvent.ACTION_UP, targetX, targetY, 0)

                              wv.dispatchTouchEvent(downEvent)
                              wv.dispatchTouchEvent(upEvent)

                              downEvent.recycle()
                              upEvent.recycle()

                              isPulsing = true
                          }
                      }
                  }
              }

              LaunchedEffect(isPulsing) {
                  if (isPulsing) {
                      delay(120L)
                      isPulsing = false
                  }
              }

              LaunchedEffect(isDesktopMode) {
                  webViewInstance?.let { wv ->
                      wv.settings.userAgentString = if (isDesktopMode) cleanDesktopUA else cleanMobileUA
                      wv.settings.useWideViewPort = isDesktopMode
                      wv.reload()
                  }
              }

              fun processAndLoadUrl(query: String) {
                  val trimmed = query.trim()
                  val finalUrl = when {
                      trimmed.startsWith("http://") || trimmed.startsWith("https://") -> trimmed
                      trimmed.contains(".") && !trimmed.contains(" ") -> "https://$trimmed"
                      else -> {
                          try {
                              "https://www.google.com/search?q=" + URLEncoder.encode(trimmed, "UTF-8")
                          } catch (e: Exception) {
                              "https://www.google.com/search?q=$trimmed"
                          }
                      }
                  }
                  inputUrl = finalUrl
                  currentUrl = finalUrl
                  webViewInstance?.loadUrl(finalUrl)
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0F172A))
              ) {
                  Column(modifier = Modifier.fillMaxSize()) {
                      Surface(
                          color = Color(0xFF1E293B),
                          shadowElevation = 6.dp,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .statusBarsPadding()
                                      .padding(horizontal = 8.dp, vertical = 6.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  IconButton(
                                      onClick = { webViewInstance?.let { if (it.canGoBack()) it.goBack() } },
                                      enabled = canGoBack
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.ArrowBack,
                                          contentDescription = "Back",
                                          tint = if (canGoBack) Color.White else Color.Gray
                                      )
                                  }

                                  IconButton(
                                      onClick = { webViewInstance?.let { if (it.canGoForward()) it.goForward() } },
                                      enabled = canGoForward
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.ArrowForward,
                                          contentDescription = "Forward",
                                          tint = if (canGoForward) Color.White else Color.Gray
                                      )
                                  }

                                  Box(
                                      modifier = Modifier
                                          .weight(1f)
                                          .height(42.dp)
                                          .clip(RoundedCornerShape(21.dp))
                                          .background(Color(0xFF334155))
                                          .padding(horizontal = 14.dp),
                                      contentAlignment = Alignment.CenterStart
                                  ) {
                                      BasicTextField(
                                          value = inputUrl,
                                          onValueChange = { inputUrl = it },
                                          singleLine = true,
                                          textStyle = TextStyle(color = Color.White, fontSize = 14.sp),
                                          cursorBrush = SolidColor(Color(0xFF38BDF8)),
                                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Go),
                                          keyboardActions = KeyboardActions(onGo = {
                                              keyboardController?.hide()
                                              processAndLoadUrl(inputUrl)
                                          }),
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                  }

                                  Spacer(modifier = Modifier.width(6.dp))

                                  IconButton(
                                      onClick = {
                                          if (isLoading) {
                                              webViewInstance?.stopLoading()
                                          } else {
                                              webViewInstance?.reload()
                                          }
                                      }
                                  ) {
                                      Icon(
                                          imageVector = if (isLoading) Icons.Default.Close else Icons.Default.Refresh,
                                          contentDescription = "Reload",
                                          tint = Color(0xFF38BDF8)
                                      )
                                  }

                                  IconButton(
                                      onClick = { isDesktopMode = !isDesktopMode }
                                  ) {
                                      Icon(
                                          imageVector = if (isDesktopMode) Icons.Default.DesktopWindows else Icons.Default.PhoneAndroid,
                                          contentDescription = "Toggle Desktop",
                                          tint = if (isDesktopMode) Color(0xFF38BDF8) else Color.LightGray
                                      )
                                  }
                              }

                              if (isLoading) {
                                  LinearProgressIndicator(
                                      progress = { progress },
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(3.dp),
                                      color = Color(0xFF38BDF8),
                                      trackColor = Color.Transparent
                                  )
                              }
                          }
                      }

                      Box(
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxWidth()
                      ) {
                          AndroidView(
                              factory = { ctx ->
                                  WebView(ctx).apply {
                                      layoutParams = ViewGroup.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT,
                                          ViewGroup.LayoutParams.MATCH_PARENT
                                      )

                                      // 1. منع إرسال هيدر X-Requested-With نهائياً لجميع النطاقات
                                      if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                                          WebSettingsCompat.setRequestedWithHeaderOriginAllowList(settings, emptySet())
                                      }

                                      with(settings) {
                                          javaScriptEnabled = true
                                          domStorageEnabled = true
                                          databaseEnabled = true
                                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                                          setSupportZoom(true)
                                          builtInZoomControls = true
                                          displayZoomControls = false
                                          useWideViewPort = true
                                          loadWithOverviewMode = true
                                          cacheMode = WebSettings.LOAD_DEFAULT
                                          userAgentString = cleanMobileUA
                                          // تفعيل تخزين وتكامل الجلسات
                                          allowFileAccess = true
                                          allowContentAccess = true
                                      }

                                      val cookieManager = CookieManager.getInstance()
                                      cookieManager.setAcceptCookie(true)
                                      cookieManager.setAcceptThirdPartyCookies(this, true)

                                      // 2. سكربت Stealth لحذف خصائص كشف البوتات ومحاكاة Chrome الحقيقي
                                      val stealthJs = """
                                          (function() {
                                              try {
                                                  // حذف مؤشرات الويب درايفر والويب فيو
                                                  delete Object.getPrototypeOf(navigator).webdriver;
                                                  Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
                                                  window.chrome = { runtime: {}, app: {}, loadTimes: function() {}, csi: function() {} };
                                                  if (!window.navigator.languages || window.navigator.languages.length === 0) {
                                                      Object.defineProperty(navigator, 'languages', { get: () => ['en-US', 'en', 'fr'] });
                                                  }
                                              } catch (e) {}
                                          })();
                                      """.trimIndent()

                                      webViewClient = object : WebViewClient() {
                                          override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                                              return false
                                          }

                                          override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                                              super.onPageStarted(view, url, favicon)
                                              isLoading = true
                                              url?.let {
                                                  currentUrl = it
                                                  inputUrl = it
                                              }
                                              // حقن السكربت بمجرد بدء تحميل الصفحة
                                              evaluateJavascript(stealthJs, null)
                                          }

                                          override fun onPageFinished(view: WebView?, url: String?) {
                                              super.onPageFinished(view, url)
                                              isLoading = false
                                              canGoBack = canGoBack()
                                              canGoForward = canGoForward()
                                              pageTitle = view?.title ?: "ApexBrowser"
                                              // إعادة التأكيد على السكربت عند انتهاء التحميل
                                              evaluateJavascript(stealthJs, null)
                                              cookieManager.flush()
                                          }

                                          override fun onReceivedSslError(view: WebView?, handler: SslErrorHandler?, error: SslError?) {
                                              handler?.proceed()
                                          }
                                      }

                                      webChromeClient = object : WebChromeClient() {
                                          override fun onProgressChanged(view: WebView?, newProgress: Int) {
                                              progress = newProgress / 100f
                                              isLoading = newProgress < 100
                                          }
                                      }

                                      loadUrl(currentUrl)
                                      webViewInstance = this
                                  }
                              },
                              modifier = Modifier.fillMaxSize()
                          )

                          if (autoClickerEnabled) {
                              Box(
                                  modifier = Modifier
                                      .offset { IntOffset(reticleOffset.x.roundToInt(), reticleOffset.y.roundToInt()) }
                                      .size(54.dp)
                                      .pointerInput(Unit) {
                                          detectDragGestures { change, dragAmount ->
                                              change.consume()
                                              reticleOffset += dragAmount
                                          }
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  if (isPulsing) {
                                      Box(
                                          modifier = Modifier
                                              .size(52.dp)
                                              .scale(1.3f)
                                              .clip(CircleShape)
                                              .background(Color(0x55EF4444))
                                      )
                                  }

                                  Box(
                                      modifier = Modifier
                                          .size(46.dp)
                                          .clip(CircleShape)
                                          .border(2.dp, Color(0xFFEF4444), CircleShape)
                                          .background(Color(0x33EF4444)),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.Adjust,
                                          contentDescription = "Target Reticle",
                                          tint = Color(0xFFEF4444),
                                          modifier = Modifier.size(24.dp)
                                      )
                                  }
                              }
                          }
                      }
                  }

                  Box(
                      modifier = Modifier
                          .offset { IntOffset(bubbleOffset.x.roundToInt(), bubbleOffset.y.roundToInt()) }
                          .size(52.dp)
                          .shadow(12.dp, CircleShape)
                          .clip(CircleShape)
                          .background(
                              Brush.linearGradient(
                                  listOf(Color(0xFF38BDF8), Color(0xFF2563EB))
                              )
                          )
                          .pointerInput(Unit) {
                              detectDragGestures { change, dragAmount ->
                                  change.consume()
                                  bubbleOffset += dragAmount
                              }
                          }
                          .clickable(
                              indication = null,
                              interactionSource = remember { MutableInteractionSource() }
                          ) {
                              hudExpanded = !hudExpanded
                          },
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          imageVector = if (hudExpanded) Icons.Default.Close else Icons.Default.Bolt,
                          contentDescription = "HUD Toggle",
                          tint = Color.White,
                          modifier = Modifier.size(28.dp)
                      )
                  }

                  AnimatedVisibility(
                      visible = hudExpanded,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .padding(16.dp)
                  ) {
                      Surface(
                          color = Color(0xEE0F172A),
                          shape = RoundedCornerShape(20.dp),
                          border = androidx.compose.foundation.BorderStroke(1.dp, Color(0x4438BDF8)),
                          shadowElevation = 16.dp,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(18.dp)) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "Apex Automation Panel",
                                      color = Color(0xFF38BDF8),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 16.sp
                                  )
                                  IconButton(onClick = { hudExpanded = false }) {
                                      Icon(Icons.Default.Close, contentDescription = "Close", tint = Color.LightGray)
                                  }
                              }

                              HorizontalDivider(color = Color(0x33FFFFFF), thickness = 1.dp)
                              Spacer(modifier = Modifier.height(12.dp))

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text(text = "Auto Refresh Engine", color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                                      Text(
                                          text = if (autoRefreshEnabled) "Next reload in ${countdownSeconds}s" else "Disabled",
                                          color = if (autoRefreshEnabled) Color(0xFF4ADE80) else Color.Gray,
                                          fontSize = 12.sp
                                      )
                                  }
                                  Switch(
                                      checked = autoRefreshEnabled,
                                      onCheckedChange = { autoRefreshEnabled = it },
                                      colors = SwitchDefaults.colors(checkedThumbColor = Color(0xFF38BDF8))
                                  )
                              }

                              Slider(
                                  value = autoRefreshInterval.toFloat(),
                                  onValueChange = { autoRefreshInterval = it.roundToInt() },
                                  valueRange = 5f..60f,
                                  steps = 55,
                                  enabled = autoRefreshEnabled
                              )

                              Spacer(modifier = Modifier.height(12.dp))
                              HorizontalDivider(color = Color(0x22FFFFFF), thickness = 1.dp)
                              Spacer(modifier = Modifier.height(12.dp))

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text(text = "Auto Clicker Engine", color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                                      Text(
                                          text = if (autoClickerEnabled) "Interval: ${clickIntervalMs}ms (Active)" else "Reticle target inactive",
                                          color = if (autoClickerEnabled) Color(0xFFEF4444) else Color.Gray,
                                          fontSize = 12.sp
                                      )
                                  }
                                  Switch(
                                      checked = autoClickerEnabled,
                                      onCheckedChange = { autoClickerEnabled = it },
                                      colors = SwitchDefaults.colors(
                                          checkedThumbColor = Color(0xFFEF4444),
                                          checkedTrackColor = Color(0x66EF4444)
                                      )
                                  )
                              }

                              Slider(
                                  value = clickIntervalMs.toFloat(),
                                  onValueChange = { clickIntervalMs = it.toLong() },
                                  valueRange = 200f..4000f,
                                  steps = 38,
                                  enabled = autoClickerEnabled
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload ApexBrowser APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexBrowser-Stealth-v1.1
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
