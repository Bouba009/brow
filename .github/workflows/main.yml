                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          if (hudExpanded) Icons.Default.Close else Icons.Default.Bolt,
                          contentDescription = "HUD Toggle",
                          tint = Color.White,
                          modifier = Modifier.size(28.dp)
                      )
                  }
          
                  AnimatedVisibility(
                      visible = hudExpanded,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .padding(16.dp)
                  ) {
                      Surface(
                          color = Color(0xEE0F172A),
                          shape = RoundedCornerShape(20.dp),
                          border = androidx.compose.foundation.BorderStroke(1.dp, Color(0x4438BDF8)),
                          shadowElevation = 16.dp,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(18.dp)) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      "Apex Browser",
                                      color = Color(0xFF38BDF8),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 16.sp
                                  )
                                  IconButton(onClick = { hudExpanded = false }) {
                                      Icon(Icons.Default.Close, contentDescription = "Close", tint = Color.LightGray)
                                  }
                              }
          
                              HorizontalDivider(color = Color(0x33FFFFFF), thickness = 1.dp)
                              Spacer(modifier = Modifier.height(10.dp))
          
                              Button(
                                  onClick = { openBlsInBrowser() },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2563EB)),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Icon(Icons.Default.OpenInBrowser, contentDescription = null, tint = Color.White)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("فتح موقع BLS الرسمي في المتصفح", color = Color.White, fontSize = 13.sp)
                              }
          
                              Spacer(modifier = Modifier.height(10.dp))
          
                              Button(
                                  onClick = {
                                      webViewInstance?.let { wv ->
                                          wv.clearCache(true)
                                          wv.clearHistory()
                                          Toast.makeText(context, "تم تنظيف بيانات WebView", Toast.LENGTH_SHORT).show()
                                      }
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF334155)),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Icon(Icons.Default.CleaningServices, contentDescription = null, tint = Color(0xFF38BDF8))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("تنظيف بيانات التصفح", color = Color.White, fontSize = 13.sp)
                              }
          
                              Spacer(modifier = Modifier.height(10.dp))
                              Text(
                                  "تم تعطيل Auto Clicker وAuto Refresh وتزييف الهوية. عند فتح BLS سيُستخدم المتصفح الرسمي/Custom Tab لتجنب مشاكل WebView الأمنية.",
                                  color = Color(0xFFCBD5E1),
                                  fontSize = 12.sp,
                                  lineHeight = 18.sp
                              )
                          }
                      }
                  }
              }
          
              DisposableEffect(Unit) {
                  onDispose {
                      bannerAd?.destroy()
                      webViewInstance?.apply {
                          stopLoading()
                          webViewClient = null
                          webChromeClient = null
                          destroy()
                      }
                  }
              }
          }
          EOF_MAIN_ACTIVITY

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Signed Release APK & Play Store Bundle (AAB)
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Upload Signed Production APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexBrowser-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ApexBrowser-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
