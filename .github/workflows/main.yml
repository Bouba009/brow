                  Text(
                      text = label,
                      color =
                          if (selected) {
                              Emerald
                          } else {
                              Gray
                          },
                      fontSize = 11.sp,
                      fontWeight =
                          if (selected) {
                              FontWeight.Bold
                          } else {
                              FontWeight.Normal
                          }
                  )
              }
          }
