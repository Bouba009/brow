@Composable
fun PostureVisualization() {

    Card(
        modifier = Modifier
            .fillMaxWidth()
            .height(300.dp),
        shape = RoundedCornerShape(24.dp),
        colors = CardDefaults.cardColors(
            containerColor =
                MaterialTheme.colorScheme.surface
        )
    ) {

        Canvas(
            modifier = Modifier.fillMaxSize()
        ) {

            val centerX = size.width / 2f

            val headY = size.height * 0.22f
            val shoulderY = size.height * 0.38f
            val spineBottom = size.height * 0.80f

            drawCircle(
                color = androidx.compose.ui.graphics.Color(0xFF63E6BE),
                radius = 30f,
                center = Offset(
                    centerX,
                    headY
                )
            )

            drawLine(
                color = androidx.compose.ui.graphics.Color(0xFF74C0FC),
                start = Offset(
                    centerX,
                    headY + 30f
                ),
                end = Offset(
                    centerX,
                    spineBottom
                ),
                strokeWidth = 12f,
                cap = StrokeCap.Round
            )

            drawLine(
                color = androidx.compose.ui.graphics.Color(0xFF63E6BE),
                start = Offset(
                    centerX - 75f,
                    shoulderY
                ),
                end = Offset(
                    centerX + 75f,
                    shoulderY
                ),
                strokeWidth = 14f,
                cap = StrokeCap.Round
            )

            drawCircle(
                color = androidx.compose.ui.graphics.Color(0xFF63E6BE),
                radius = 105f,
                center = Offset(
                    centerX,
                    size.height * 0.52f
                ),
                style = Stroke(
                    width = 3f
                )
            )
        }
    }
}

