          @Composable
          private fun ExercisesScreen(
              modifier: Modifier
          ) {

              LazyColumn(
                  modifier = modifier
                      .fillMaxSize()
                      .background(Background)
                      .padding(18.dp),
                  verticalArrangement =
                      Arrangement.spacedBy(14.dp)
              ) {

                  item {

                      Text(
                          text = "Exercises",
                          color = TextPrimary,
                          fontSize = 28.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          text =
                              "Simple exercises for better posture.",
                          color = TextSecondary,
                          fontSize = 14.sp
                      )
                  }

                  items(exercises) { exercise ->

                      ExerciseCard(
                          exercise = exercise
                      )
                  }
              }
          }

          @Composable
          private fun ExerciseCard(
              exercise: Exercise
          ) {

              var seconds by remember {
                  mutableIntStateOf(60)
              }

              var running by remember {
                  mutableStateOf(false)
              }

              LaunchedEffect(running) {

                  while (running && seconds > 0) {

                      delay(1000)

                      if (seconds > 0) {
                          seconds--
                      }

                      if (seconds == 0) {
                          running = false
                      }
                  }
              }

              Card(
                  modifier = Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(
                      containerColor = SurfaceDark
                  ),
                  shape = RoundedCornerShape(22.dp)
              ) {

                  Column(
                      modifier = Modifier.padding(16.dp)
                  ) {

                      ExerciseCanvas(
                          modifier =
                              Modifier
                                  .fillMaxWidth()
                                  .height(190.dp),
                          exercise = exercise.title
                      )

                      Spacer(
                          modifier = Modifier.height(10.dp)
                      )

                      Text(
                          text = exercise.title,
                          color = TextPrimary,
                          fontSize = 21.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(
                          modifier = Modifier.height(7.dp)
                      )

                      Text(
                          text = exercise.description,
                          color = TextSecondary,
                          fontSize = 14.sp,
                          lineHeight = 20.sp
                      )

                      Spacer(
                          modifier = Modifier.height(9.dp)
                      )

                      Text(
                          text =
                              "Target: ${exercise.target}",
                          color = Blue,
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          text =
                              "Common mistake: ${exercise.mistake}",
                          color = TextSecondary,
                          fontSize = 13.sp
                      )

                      Spacer(
                          modifier = Modifier.height(12.dp)
                      )

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment =
                              Alignment.CenterVertically
                      ) {

                          Text(
                              text =
                                  "%02d:%02d".format(
                                      seconds / 60,
                                      seconds % 60
                                  ),
                              color = TextPrimary,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.Bold,
                              modifier =
                                  Modifier.weight(1f)
                          )

                          TimerButton(
                              icon =
                                  if (running)
                                      Icons.Default.Pause
                                  else
                                      Icons.Default.PlayArrow,
                              text =
                                  if (running)
                                      "Pause"
                                  else
                                      "Start"
                          ) {
                              running = !running
                          }

                          Spacer(
                              modifier = Modifier.size(7.dp)
                          )

                          TimerButton(
                              icon = Icons.Default.Refresh,
                              text = "Reset"
                          ) {
                              running = false
                              seconds = 60
                          }
                      }
                  }
              }
          }

          @Composable
          private fun TimerButton(
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              text: String,
              onClick: () -> Unit
          ) {

              val interactionSource =
                  remember {
                      MutableInteractionSource()
                  }

              Row(
                  modifier =
                      Modifier
                          .clickable(
                              interactionSource =
                                  interactionSource,
                              indication = null,
                              onClick = onClick
                          )
                          .background(
                              color = SurfaceLight,
                              shape =
                                  RoundedCornerShape(12.dp)
                          )
                          .padding(
                              horizontal = 10.dp,
                              vertical = 8.dp
                          ),
                  verticalAlignment =
                      Alignment.CenterVertically
              ) {

                  Icon(
                      imageVector = icon,
                      contentDescription = text,
                      tint = TextPrimary,
                      modifier = Modifier.size(18.dp)
                  )

                  Spacer(
                      modifier = Modifier.size(4.dp)
                  )

                  Text(
                      text = text,
                      color = TextPrimary,
                      fontSize = 12.sp
                  )
              }
          }

