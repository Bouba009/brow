package com.safeposture

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.Service
import android.content.Context
import android.content.Intent
import android.hardware.Sensor
import android.hardware.SensorEvent
import android.hardware.SensorEventListener
import android.hardware.SensorManager
import android.media.AudioAttributes
import android.media.AudioManager
import android.media.RingtoneManager
import android.media.ToneGenerator
import android.os.Build
import android.os.IBinder
import android.os.VibrationEffect
import android.os.Vibrator
import android.os.VibratorManager
import androidx.core.app.NotificationCompat
import android.content.pm.ServiceInfo
import kotlin.math.abs
import kotlin.math.atan2
import kotlin.math.sqrt

class PostureMonitorService : Service(), SensorEventListener {

    companion object {
        private const val CHANNEL_ID = "posture_alerts"
        private const val NOTIFICATION_ID = 1001

        private const val BAD_POSTURE_ANGLE = 25f
        private const val REQUIRED_TIME_MS = 2000L
    }

    private lateinit var sensorManager: SensorManager
    private var accelerometer: Sensor? = null

    private var badPostureStartedAt = 0L
    private var alertActive = false

    private var ringtone: android.media.Ringtone? = null
    private var toneGenerator: ToneGenerator? = null

    override fun onCreate() {
        super.onCreate()

        createNotificationChannel()

        sensorManager =
            getSystemService(Context.SENSOR_SERVICE) as SensorManager

        accelerometer =
            sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)

        accelerometer?.let {
            sensorManager.registerListener(
                this,
                it,
                SensorManager.SENSOR_DELAY_NORMAL
            )
        }

        startAsForeground()
    }

    private fun createNotificationChannel() {

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

            val channel = NotificationChannel(
                CHANNEL_ID,
                "Posture Alerts",
                NotificationManager.IMPORTANCE_HIGH
            )

            channel.description =
                "Alerts when your phone posture indicates excessive forward bending"

            channel.enableVibration(true)

            val manager =
                getSystemService(NotificationManager::class.java)

            manager.createNotificationChannel(channel)
        }
    }

    private fun startAsForeground() {

        val notification = buildNotification(
            "SafePosture is monitoring your posture"
        )

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

            startForeground(
                NOTIFICATION_ID,
                notification,
                ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
            )

        } else {

            startForeground(
                NOTIFICATION_ID,
                notification
            )
        }
    }

    private fun buildNotification(text: String): Notification {

        return NotificationCompat.Builder(this, CHANNEL_ID)
            .setSmallIcon(com.safeposture.R.drawable.ic_notification)
            .setContentTitle("SafePosture")
            .setContentText(text)
            .setPriority(NotificationCompat.PRIORITY_HIGH)
            .setCategory(NotificationCompat.CATEGORY_REMINDER)
            .setOngoing(true)
            .setAutoCancel(false)
            .build()
    }

    override fun onSensorChanged(event: SensorEvent?) {

        if (event == null) return

        if (event.sensor.type != Sensor.TYPE_ACCELEROMETER) return

        val x = event.values[0]
        val y = event.values[1]
        val z = event.values[2]

        val pitch = Math.toDegrees(
            atan2(
                (-x).toDouble(),
                sqrt((y * y + z * z).toDouble())
            )
        ).toFloat()

        val forwardTilt = abs(pitch)

        if (forwardTilt >= BAD_POSTURE_ANGLE) {

            if (badPostureStartedAt == 0L) {
                badPostureStartedAt = System.currentTimeMillis()
            }

            val duration =
                System.currentTimeMillis() - badPostureStartedAt

            if (duration >= REQUIRED_TIME_MS && !alertActive) {
                triggerAlert()
            }

        } else {

            badPostureStartedAt = 0L

            if (alertActive) {
                stopAlert()
            }
        }
    }

    private fun triggerAlert() {

        alertActive = true

        vibrateTwice()
        playAlertSound()

        val manager =
            getSystemService(Context.NOTIFICATION_SERVICE)
                as NotificationManager

        manager.notify(
            NOTIFICATION_ID,
            buildNotification(
                "⚠ Straighten your neck and back"
            )
        )
    }

    private fun stopAlert() {

        alertActive = false

        try {
            ringtone?.stop()
        } catch (error: Exception) {
            // Ignore ringtone stop errors
        }

        ringtone = null

        try {
            toneGenerator?.release()
        } catch (error: Exception) {
            // Ignore tone release errors
        }

        toneGenerator = null

        val manager =
            getSystemService(Context.NOTIFICATION_SERVICE)
                as NotificationManager

        manager.notify(
            NOTIFICATION_ID,
            buildNotification(
                "✓ Posture is normal"
            )
        )
    }

    private fun playAlertSound() {

        try {

            val uri =
                RingtoneManager.getDefaultUri(
                    RingtoneManager.TYPE_NOTIFICATION
                )

            ringtone =
                RingtoneManager.getRingtone(
                    applicationContext,
                    uri
                )

            ringtone?.audioAttributes =
                AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                    .setContentType(
                        AudioAttributes.CONTENT_TYPE_SONIFICATION
                    )
                    .build()

            ringtone?.play()

        } catch (error: Exception) {

            try {

                toneGenerator =
                    ToneGenerator(
                        AudioManager.STREAM_NOTIFICATION,
                        80
                    )

                toneGenerator?.startTone(
                    ToneGenerator.TONE_PROP_BEEP2,
                    600
                )

            } catch (toneError: Exception) {
                // Ignore sound errors
            }
        }
    }

    private fun vibrateTwice() {

        val vibrator: Vibrator

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

            val manager =
                getSystemService(Context.VIBRATOR_MANAGER_SERVICE)
                    as VibratorManager

            vibrator = manager.defaultVibrator

        } else {

            @Suppress("DEPRECATION")
            vibrator =
                getSystemService(Context.VIBRATOR_SERVICE)
                    as Vibrator
        }

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

            vibrator.vibrate(
                VibrationEffect.createWaveform(
                    longArrayOf(
                        0,
                        180,
                        120,
                        180
                    ),
                    -1
                )
            )

        } else {

            @Suppress("DEPRECATION")
            vibrator.vibrate(
                longArrayOf(
                    0,
                    180,
                    120,
                    180
                ),
                -1
            )
        }
    }

    override fun onAccuracyChanged(
        sensor: Sensor?,
        accuracy: Int
    ) {
    }

    override fun onBind(intent: Intent?): IBinder? {
        return null
    }

    override fun onDestroy() {

        sensorManager.unregisterListener(this)

        try {
            ringtone?.stop()
        } catch (error: Exception) {
            // Ignore
        }

        try {
            toneGenerator?.release()
        } catch (error: Exception) {
            // Ignore
        }

        super.onDestroy()
    }

    override fun onStartCommand(
        intent: Intent?,
        flags: Int,
        startId: Int
    ): Int {

        return START_STICKY
    }
}
